<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jobly - Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 420px;
        margin: 40px auto;
        color: #18181b;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 14px;
        margin-top: 28px;
        border-top: 1px solid #e4e4e7;
        padding-top: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #52525b;
        margin-top: 14px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        background: #18181b;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #3f3f46;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #urlStatus,
      #authStatus {
        margin-top: 12px;
        font-size: 13px;
      }
      p.hint {
        font-size: 12px;
        color: #71717a;
      }
      #signedInPanel {
        display: none;
      }
      #signedInPanel p {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Jobly extension settings</h1>

    <label>Jobly URL</label>
    <input id="apiUrl" placeholder="http://localhost:3000" />
    <p class="hint">Where your Jobly app is running - local dev URL, or your deployed Vercel URL.</p>
    <button id="saveUrl" class="secondary">Save URL</button>
    <button id="testUrl" class="secondary">Test connection</button>
    <div id="urlStatus"></div>

    <div id="signInPanel">
      <h2>Sign in</h2>
      <p class="hint">Use the same email and password as your Jobly dashboard - the extension links straight to your account, no token to copy.</p>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label>Password</label>
      <input id="password" type="password" placeholder="Password" />
      <button id="signIn">Sign in</button>
      <div id="authStatus"></div>
    </div>

    <div id="signedInPanel">
      <h2>Account</h2>
      <p>Signed in as <strong id="signedInEmail"></strong></p>
      <button id="signOut" class="secondary">Sign out</button>
    </div>

    <script src="auth.js"></script>
    <script src="options.js"></script>
  </body>
</html>
