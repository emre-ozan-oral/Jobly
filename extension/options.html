<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jobly - Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 420px;
        margin: 40px auto;
        color: #18181b;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #52525b;
        margin-top: 14px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #d4d4d8;
        border-radius: 6px;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        background: #18181b;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
      }
      p.hint {
        font-size: 12px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <h1>Jobly extension settings</h1>
    <p class="hint">
      Sign in to your Jobly dashboard and copy your personal token from the
      Extension Setup page (under Settings).
    </p>
    <label>Jobly URL</label>
    <input id="apiUrl" placeholder="http://localhost:3000" />
    <label>Personal API token</label>
    <input id="apiKey" placeholder="paste your token here" />
    <button id="save">Save</button>
    <button id="test" style="background:#3f3f46">Test connection</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
